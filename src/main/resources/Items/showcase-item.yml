item:
  model-data: 499
  flags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
  enchants:
    - "infinity"
  material: "RAW_IRON"
  name: "<gold>Showcase Item"
  lore:
    - "<blue>Showcase"
    - "<dark_gray><i>See how it works!"
    - ""
    - "<dark_gray>┏<st> "
    - "<dark_gray>| <yellow>ʟᴇꜰᴛ ᴄʟɪᴄᴋ<dark_gray> → <gray>Test!"
    - "<dark_gray>┗<st> "
  hide-tooltip: false
  placeholders:
    single: "<gold>Showcase" # Shows when this item is mentioned as one (1), e.g: when getting it with the `give` command
    multiple: "<gold>Showcases" # Shows when this item is mentioned as more than one (1+), e.g: when getting it with the `give` command
  attributes:
    stackable: true # Allow stacking of the item [MAY CAUSE ISSUES WITH DURABILITY]
    durability: 1 # Custom item durability - DOES NOT AFFECT VANILLA ITEM DURABILITY
    on-break-replacement: "Items/Currency/showcase-item.yml" # Replace the item with this new one when the "attributes.durability" reaches 0
    allow-enchant: false # Allow the item to be used inside an enchanting table
    allow-anvil: false # Allow the item to be used inside an anvil
  actions:
    event:
      # Simple showcase of event actions:
      DROP_ITEM:
        - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <gray>Dropped the item!"
      # More complex showcase of the full event system
      LEFT_CLICK: # Event type
        showcase-event-action-1: # ID (can be anything)
          settings:
            weight: 0 # Set to -1 to always execute | Set ALL to 0 to execute all of them | Set to anything else to execute ONE of them.
            chance:
              amount: 100.0 # Chance to execute
              reroll-weight: false # Re-roll for the other groups in this click-type, if there are none -> run 'fail'
              reroll-fail: # Executables for when the reroll fails
                - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <red>Failed `left click` chance!"
            cancel-event:
              - "*" # Cancel the event no matter the source it came from (block_dig, attack, etc.), use `*` for any
            price: # The cost to execute - charged if the conditions are met
              money:
                amount: 100.0
              item:
                currencies:
                  1:
                    currency: "Items/Currency/example.yml"
                    amount: 1
          conditions: # Conditions & actions, don't use "if:" to skip the condition check entirely (always run)
            if:
              condition: "%item-slot% == 0 || %item-slot% == 1"
              self-use: true # Use on self or on another target (if applicable)
              durability-cost: 1 # Durability cost to execute
              cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
              then:
                - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <gray>Left click from slots 0 to 1!"
                - "[SPECIAL] gui-open GUIs/showcase-gui.yml"
              on-cooldown:
                self-use: true # Use on self or on another target (if applicable)
                durability-cost: 1 # Durability cost to execute
                cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                then:
                  - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <red>Cooldown for `left click` from slots 0 to 1!"
              else-if:
                condition: "%item-slot% == 2 || %item-slot% == 3"
                self-use: true # Use on self or on another target (if applicable)
                durability-cost: 1 # Durability cost to execute
                cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                then:
                  - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <gray>Left click from slots 2 to 3!"
                  - "[SPECIAL] dialog-open Dialogues/showcase-dialogue.yml"
                on-cooldown:
                  self-use: true # Use on self or on another target (if applicable)
                  durability-cost: 1 # Durability cost to execute
                  cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                  then:
                    - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <red>Cooldown for `left click` from slots 2 to 3!"
                else-if:
                  condition: "%item-slot% == 4 || %item-slot% == 5"
                  self-use: true # Use on self or on another target (if applicable)
                  durability-cost: 1 # Durability cost to execute
                  cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                  then:
                    - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <gray>Left click from slots 4 to 5!"
                  on-cooldown:
                    self-use: true # Use on self or on another target (if applicable)
                    durability-cost: 1 # Durability cost to execute
                    cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                    then:
                      - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <red>Cooldown for `left click` from slots 4 to 5!"
                  else:
                    self-use: true # Use on self or on another target (if applicable)
                    durability-cost: 1 # Durability cost to execute
                    cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                    then:
                      - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <gray>Left click from slots 6+!"
                    on-cooldown:
                      self-use: true # Use on self or on another target (if applicable)
                      durability-cost: 1 # Durability cost to execute
                      cooldown: 10 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                      then:
                        - "[MESSAGE] <dark_gray>[<red><b>ITEM ACTION</b><dark_gray>] <red>Cooldown for `left click` from slots 6+"

    passive:
      showcase-passive-action-1:
        weight: 0 # Set to -1 to always execute | Set ALL to 0 to execute all of them | Set to anything else to execute ONE of them.
        chance:
          amount: 100.0 # Chance to execute
          reroll-weight: false # Re-roll for the other groups in this click-type, if there are none -> run 'fail'
          fail:
            - "[MESSAGE] <dark_gray>[<blue><b>ITEM PASSIVE</b><dark_gray>] <red>Failed `passive` chance!"
        cancel-event:
          - "*" # Cancel the event no matter the source it came from (block_dig, attack, etc.), use `*` for any
        price: # The cost to execute - charged if the conditions are met
          money:
            amount: 100.0
          item:
            currencies:
              1:
                currency: "Items/Currency/scrap.yml"
                amount: 1

        conditions: # Conditions & actions, don't use "if:" to skip the condition check entirely (always run)
          if:
            condition: "%item-slot% == 0 || %item-slot% == 1"
            self-use: true # Use on self or on another target (if applicable)
            durability-cost: 1 # Durability cost to execute
            cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
            then:
              - "[MESSAGE] <dark_gray>[<blue><b>PASSIVE</b><dark_gray>] <gray>Passive tick from slots 0 to 1!"
            on-cooldown:
              self-use: true # Use on self or on another target (if applicable)
              durability-cost: 1 # Durability cost to execute
              cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
              then:
                - "[MESSAGE] <dark_gray>[<red><b>PASSIVE</b><dark_gray>] <red>Cooldown for `passive` from slots 1 to 2!"
            else-if:
              condition: "%item-slot% == 2 || %item-slot% == 3"
              self-use: true # Use on self or on another target (if applicable)
              durability-cost: 1 # Durability cost to execute
              cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
              then:
                - "[MESSAGE] <dark_gray>[<blue><b>PASSIVE</b><dark_gray>] <gray>Passive tick from slots 2 to 3!"
              on-cooldown:
                self-use: true # Use on self or on another target (if applicable)
                durability-cost: 1 # Durability cost to execute
                cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                then:
                  - "[MESSAGE] <dark_gray>[<red><b>PASSIVE</b><dark_gray>] <red>Cooldown for `passive` from slots 3 to 4!"
              else-if:
                condition: "%item-slot% == 4 || %item-slot% == 5"
                self-use: true # Use on self or on another target (if applicable)
                durability-cost: 1 # Durability cost to execute
                cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                then:
                  - "[MESSAGE] <dark_gray>[<blue><b>PASSIVE</b><dark_gray>] <gray>Passive tick from slots 4 to 5!"
                on-cooldown:
                  self-use: true # Use on self or on another target (if applicable)
                  durability-cost: 1 # Durability cost to execute
                  cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                  then:
                    - "[MESSAGE] <dark_gray>[<red><b>PASSIVE</b><dark_gray>] <red>Cooldown for `passive` from slots 4 to 5!"
                else:
                  self-use: true # Use on self or on another target (if applicable)
                  durability-cost: 1 # Durability cost to execute
                  cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                  then:
                    - "[MESSAGE] <dark_gray>[<blue><b>PASSIVE</b><dark_gray>] <gray>Passive tick from slots 6+!"
                  on-cooldown:
                    self-use: true # Use on self or on another target (if applicable)
                    durability-cost: 1 # Durability cost to execute
                    cooldown: 100 # Ticks - Cooldowns are applied per-condition, so you can still use the rest
                    then:
                      - "[MESSAGE] <dark_gray>[<red><b>PASSIVE</b><dark_gray>] <red>Cooldown for `passive` from slots 6+!"