# !!!!! WARNING !!!!!
# Deleting this file (config.yml) will re-create EVERY default file [NON-REVERSIBLE]

resource-pack:
  enabled: false # false = RaidCore won't build, host or send a resource pack (use this if another plugin handles it)
  force: false # Players that decline the resource pack get kicked
  host: "" # Address players download the pack from, e.g. "localhost:8642" or "mydomain.com:8642" | Empty = auto-detect the public IP
  pack-format: 46 # Pack format of your server version | Ignored if you put your own pack.mcmeta in the Pack folder

web:
  port: 8642

database:
  update-interval: 80 # Ticks | How often to update the databases | LOW PERFORMANCE IMPACT

passive-tracker:
  slots-per-tick: 3 # How many slots to check every tick for passive items in the player's inventory | HIGH PERFORMANCE IMPACT

gui:
  max-history: 14 # How many GUIs to store when using the "gui-back" special tag | LOW PERFORMANCE IMPACT

chat-input:
  default:
    title: "<white>Type in chat"
    subtitle: "<white>the new value"
    fade-in: 0 # Ticks
    stay: 20 # Ticks
    fade-out: 0 # Ticks


# DO NOT TOUCH THIS
current-version: 0

