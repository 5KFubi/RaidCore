recipe:
  permission: "raidcore.recipe.showcase"
  multi-table-allow: true # Allow recipes from 1 type of inventory into another, example: crafting-table to player-craft if the recipe is small enough
  unlock-on-obtain: true # Obtain the recipe when picking up the required items to craft it
  player-craft:
    1:
      - "XA"
      - "XB"
    2:
      - "AX"
      - "BX"
  crafting-table:
    1:
      - "XAX"
      - "ABA"
      - "XAX"
  anvil:
    1:
      left: "A"
      right: "B"
  furnace:
    ingredient: "A"
    cook-time: 200
    experience: 0.7
  smoking:
    ingredient: "A"
    cook-time: 100
  stonecutter:
    ingredient: "A"
  smithing:
    template: "A"
    base: "B"
    addition: "C"
  brewing:
    input: "A"
    ingredient: "B"
  ingredients:
    X:
      item: "AIR"
    A:
      item: "IRON_INGOT" # Vanilla Minecraft item
      model: 499 # Needs to have this model data, set to 0 for no model data, set to -1 for any model data
      amount: 2 # Needs to be at least this amount, 1 by default
      return: "raidcore:Items/Currency/showcase-item.yml" # Replace the item by this after crafting, leave empty for none
    B:
      item: "dungeonraiders:Items/Currency/showcase-item.yml" # Custom item
      amount: 1
      return:
        pool:
          item: "itemsadder:<namespace>" # Replace the item by this after crafting, leave empty for none
          amount: 1
          chance: 2
          execute: []
  placeholder-item: "Items/Misc/mystery-item.yml" # What item to show before the craft, will use the first item in the result pool if empty / null
  result:
    pool:
      common:
        item: "raidcore:Items/Showcase/sword.yml"
        amount: 1
        chance: 80.50 # Percent chance - transform to weight based on all the other items
        execute:
          - "[MESSAGE] <gray>You crafted a common sword!"
      rare:
        item: "dungeonraiders:Items/Showcase/rare-sword.yml"
        amount: 1
        chance: 20.00
        execute:
          - "[MESSAGE] <gold>You crafted a rare sword!"