
# GUI slot numbers and sizes
#
#   0   1   2   3   4   5   6   7   8   |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 1 - [MIN]
#   9   10  11  12  13  14  15  16  17  |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 2
#   18  19  20  21  22  23  24  25  26  |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 3
#   27  28  29  30  31  32  33  34  35  |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 4
#   36  37  38  39  40  41  42  43  44  |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 5
#   45  46  47  48  49  50  51  52  53  |
#   ██  ██  ██  ██  ██  ██  ██  ██  ██  | ROW 6 - [MAX]
#

gui:
  title: "<dark_grey>Showcase storage" # GUI title
  placeholder-name: "<dark_gray>[<gray>Showcase storage<dark_gray>]" # Display name for the `%previous-gui-name%` placeholder
  size: 6 # How many rows the GUI should have
  refresh-rate: 1 # Refresh the GUI every X ticks
  inactivity-timer: 2400 # Ticks | Amount it takes to close the inventory due to inactivity | Set to 0 to disable
  inactivity-message:
    - "<dark_grey>GUI closed due to inactivity."
  open-sound: "block.chest.open 1.0 1.0" # <SOUND> <VOLUME> <PITCH> | Sound to play when the GUI is opened | Opening other GUIs will not play this sound
  close-sound: "block.chest.close 1.0 1.0" # <SOUND> <VOLUME> <PITCH> | Sound to play when the GUI is closed | Switching to other GUIs will not play this sound
  switch-sound: "block.chest.open 1.0 0.5" # <SOUND> <VOLUME> <PITCH> | Sound to play when switching to another GUI

empty-slots:
  material: "BLACK_STAINED_GLASS_PANE" # Empty slots in the GUI will be filled with this item
  model-data: 0 # Item's custom model data
  name: "" # Display name


groups:
  showcase-storage:
    settings:
      repeat-last-page: auto
    item-type: "STORAGE private-vault %player-name% 60" # `private-vault` being the id, `%player-name%` being the uid, and 60 being the default slot amount for newly created storages
    slots: [ "0-44" ]
    amount: 1
    gradual-amount: false
    model-data: 499
    flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    gradual-model-data: false
    material: "OAK_BUTTON"
    name: "<gray>Locked slot"
    variations:
      empty-slot:
        material: "AIR" # default to air always unless specified here
        actions:
          LEFT_CLICK:
            - "[MESSAGE] you have left clicked a empty storage slot! (debug)"
      occupied-slot:
        actions:
          LEFT_CLICK:
            - "[MESSAGE] you have left clicked a storage item! (debug)"

  page-change: # Group ID
    1: # Page number
      previous: # Item ID
        item-type: "NONE"
        slots: [ "45" ]
        amount: 1
        model-data: 499
        flags:
          - "HIDE_ATTRIBUTES"
        material: "FEATHER"
        name: "<white>Left"
        actions:
          LEFT_CLICK:
            - "[MESSAGE] page-change back"
            - "[SPECIAL] change-page showcase-storage backward"
          right-click:
            - "[MESSAGE] page-change back"
            - "[SPECIAL] change-page showcase-storage backward"
          drop:
            - "[MESSAGE] page-change back reset"
            - "[SPECIAL] change-page showcase-storage 1"
      next: # Item ID
        item-type: "NONE"
        slots: [ "53" ]
        amount: 1
        model-data: 499
        flags:
          - "HIDE_ATTRIBUTES"
        material: "FEATHER"
        name: "<white>Right"
        actions:
          LEFT_CLICK:
            - "[MESSAGE] page-change front"
            - "[SPECIAL] change-page showcase-storage forward"
          right-click:
            - "[MESSAGE] page-change front"
            - "[SPECIAL] change-page showcase-storage forward"
          drop:
            - "[MESSAGE] page-change reset"
            - "[SPECIAL] change-page showcase-storage 1"